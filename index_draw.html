<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sengoku The Buddha - HTML5 Canvas Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0c10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            text-align: center;
        }
        canvas {
            border: 2px solid #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            border-radius: 8px;
            background: radial-gradient(circle, #2a1b00 0%, #050505 100%);
        }
        h1 {
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            font-size: 24px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>FLEET ADMIRAL SENGOKU - DAIBUTSU</h1>
    <canvas id="sengokuCanvas" width="800" height="600"></canvas>
</div>

<script>
const canvas = document.getElementById('sengokuCanvas');
const ctx = canvas.getContext('2d');

const centerX = canvas.width / 2;
const centerY = canvas.height / 2;

// Quản lý trạng thái animation
let frame = 0;
let shockwaves = [];

// Hàm tạo hiệu ứng vòng sóng xung kích (Shockwave)
function createShockwave(x, y) {
    shockwaves.push({
        x: x,
        y: y,
        radius: 10,
        maxRadius: 280,
        alpha: 1,
        lineWidth: 12
    });
}

// Lớp vẽ background ánh hào quang
function drawAura() {
    frame++;
    
    // Ánh sáng vàng nhấp nháy phía sau
    const glowRadius = 180 + Math.sin(frame * 0.05) * 15;
    const gradient = ctx.createRadialGradient(centerX, centerY - 20, 20, centerX, centerY - 20, glowRadius + 100);
    gradient.addColorStop(0, 'rgba(255, 223, 0, 0.5)');
    gradient.addColorStop(0.5, 'rgba(255, 140, 0, 0.2)');
    gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(centerX, centerY - 20, glowRadius + 100, 0, Math.PI * 2);
    ctx.fill();

    // Tia sáng phát ra xung quanh
    ctx.save();
    ctx.translate(centerX, centerY - 40);
    ctx.rotate(frame * 0.005);
    ctx.strokeStyle = 'rgba(255, 215, 0, 0.15)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 16; i++) {
        ctx.rotate(Math.PI / 8);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, 350);
        ctx.stroke();
    }
    ctx.restore();
}

function drawSengoku() {
    ctx.save();
        const breath = Math.sin(frame * 0.04) * 3;

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(centerX - 180, centerY + 220);
    ctx.quadraticCurveTo(centerX - 220, centerY - 20, centerX - 120, centerY - 100 + breath);
    ctx.lineTo(centerX + 120, centerY - 100 + breath);
    ctx.quadraticCurveTo(centerX + 220, centerY - 20, centerX + 180, centerY + 220);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#d4af37';
    ctx.fillRect(centerX - 190, centerY - 95 + breath, 60, 20);
    ctx.fillRect(centerX + 130, centerY - 95 + breath, 60, 20);

    const goldGradient = ctx.createLinearGradient(centerX - 150, 0, centerX + 150, 0);
    goldGradient.addColorStop(0, '#b8860b');
    goldGradient.addColorStop(0.3, '#ffd700');
    goldGradient.addColorStop(0.5, '#fff8dc');
    goldGradient.addColorStop(0.7, '#ffd700');
    goldGradient.addColorStop(1, '#b8860b');

    ctx.fillStyle = goldGradient;
    
    ctx.beginPath();
    ctx.moveTo(centerX - 140, centerY - 70 + breath);
    ctx.lineTo(centerX + 140, centerY - 70 + breath);
    ctx.lineTo(centerX + 110, centerY + 120);
    ctx.lineTo(centerX - 110, centerY + 120);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#8b6508';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(centerX - 90, centerY - 20 + breath);
    ctx.quadraticCurveTo(centerX, centerY + 10 + breath, centerX + 90, centerY - 20 + breath);
    ctx.moveTo(centerX, centerY - 20 + breath);
    ctx.lineTo(centerX, centerY + 80);
    ctx.stroke();


    ctx.fillStyle = '#daa520';
    ctx.beginPath();
    ctx.arc(centerX, centerY - 140 + breath, 65, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = goldGradient;
    ctx.beginPath();
    ctx.arc(centerX, centerY - 120 + breath, 40, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Mắt & Kính đen
    ctx.fillStyle = '#000';
    ctx.fillRect(centerX - 28, centerY - 132 + breath, 22, 14);
    ctx.fillRect(centerX + 6, centerY - 132 + breath, 22, 14);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(centerX - 28, centerY - 132 + breath, 22, 14);
    ctx.strokeRect(centerX + 6, centerY - 132 + breath, 22, 14);
    ctx.beginPath();
    ctx.moveTo(centerX - 6, centerY - 125 + breath);
    ctx.lineTo(centerX + 6, centerY - 125 + breath);
    ctx.stroke();

    ctx.fillStyle = '#d4af37';
    ctx.beginPath();
    ctx.moveTo(centerX - 8, centerY - 95 + breath);
    ctx.lineTo(centerX + 8, centerY - 95 + breath);
    ctx.lineTo(centerX + 5, centerY - 30 + breath);
    ctx.lineTo(centerX - 5, centerY - 30 + breath);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#8b6508';
    ctx.stroke();

    
    ctx.fillStyle = goldGradient;
    ctx.beginPath();
    ctx.arc(centerX - 130, centerY + 20 + breath, 35, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    const handX = centerX + 60;
    const handY = centerY + 30;

    // Bắp tay phải
    ctx.beginPath();
    ctx.moveTo(centerX + 110, centerY - 50 + breath);
    ctx.lineTo(handX + 60, handY + 10);
    ctx.lineTo(handX - 20, handY + 40);
    ctx.lineTo(centerX + 90, centerY + 50);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ffe066';
    ctx.beginPath();
    ctx.arc(handX, handY, 55, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#b8860b';
    ctx.lineWidth = 4;
    ctx.stroke();

    for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.arc(handX + (i * 20), handY - 45 + Math.abs(i)*4, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    }

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(handX, handY, 18, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    return { handX, handY };
}

function updateAndDrawShockwaves() {
    for (let i = shockwaves.length - 1; i >= 0; i--) {
        let sw = shockwaves[i];
        sw.radius += 6; 
        sw.alpha -= 0.018; 
        sw.lineWidth *= 0.98;

        if (sw.alpha <= 0 || sw.radius >= sw.maxRadius) {
            shockwaves.splice(i, 1);
            continue;
        }

        ctx.save();
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 235, 130, ${sw.alpha})`;
        ctx.lineWidth = sw.lineWidth;
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 20;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius * 0.7, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 255, 255, ${sw.alpha * 0.7})`;
        ctx.lineWidth = sw.lineWidth / 2;
        ctx.stroke();
        ctx.restore();
    }
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawAura();

    const handPos = drawSengoku();

    if (frame % 45 === 0) {
        createShockwave(handPos.handX, handPos.handY);
    }

    updateAndDrawShockwaves();

    requestAnimationFrame(animate);
}

canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;
    createShockwave(clickX, clickY);
});

animate();
</script>

</body>
</html>
